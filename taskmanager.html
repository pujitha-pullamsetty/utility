<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <link rel="stylesheet" href="taskmanager.css">
</head>
<body>
    <div class="container home">
        <h1>🌈 Welcome to Utility Hub 🌈</h1>
        <div class="nav-grid">
            <a href="quotegenerator.html" class="nav-card">💬 Random Quote Generator</a>
            <a href="clock.html" class="nav-card">⏰ Digital Clock & Timer</a>
            <a href="weather.html" class="nav-card">☁️ Mini Weather App</a>
            <a href="taskmanager.html" class="nav-card">📝 To-Do / Task Manager</a>
        </div>
    </div>
    <div class="container">
        <h1>To-Do App</h1>

        <div class="input-group">
            <input type="text" id="new-task-input" placeholder="Enter new task...">
            <button id="add-task-btn">Add Task</button>
        </div>

        <div class="filters">
            <button data-filter="all" class="filter-btn active">All</button>
            <button data-filter="pending" class="filter-btn">Pending</button>
            <button data-filter="completed" class="filter-btn">Completed</button>
        </div>

        <ul id="task-list"></ul>
    </div>

    <script>
        const newTaskInput = document.getElementById('new-task-input');
const addTaskBtn = document.getElementById('add-task-btn');
const taskList = document.getElementById('task-list');
const filterButtons = document.querySelectorAll('.filter-btn');

let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

function saveTasks() {
    localStorage.setItem('tasks', JSON.stringify(tasks));
}

function renderTasks(filter = 'all') {
    taskList.innerHTML = '';

    tasks
        .filter(task => {
            if (filter === 'all') return true;
            return filter === 'completed' ? task.completed : !task.completed;
        })
        .forEach((task, index) => {
            const li = document.createElement('li');
            li.className = `task-item ${task.completed ? 'completed' : ''}`;
            li.draggable = true;
            li.dataset.index = index;

            li.innerHTML = `
                <span class="task-text">${task.text}</span>
                <div class="task-actions">
                    <button onclick="toggleComplete(${index})">✔️</button>
                    <button onclick="editTask(${index})">✏️</button>
                    <button onclick="deleteTask(${index})">🗑️</button>
                </div>
            `;

            li.addEventListener('dragstart', dragStart);
            li.addEventListener('dragover', dragOver);
            li.addEventListener('drop', drop);

            taskList.appendChild(li);
        });
}

function addTask() {
    const text = newTaskInput.value.trim();
    if (!text) return;

    tasks.push({ text, completed: false });
    newTaskInput.value = '';
    saveTasks();
    renderTasks();
}

function editTask(index) {
    const newText = prompt('Edit task:', tasks[index].text);
    if (newText !== null) {
        tasks[index].text = newText.trim();
        saveTasks();
        renderTasks();
    }
}

function toggleComplete(index) {
    tasks[index].completed = !tasks[index].completed;
    saveTasks();
    renderTasks();
}

function deleteTask(index) {
    tasks.splice(index, 1);
    saveTasks();
    renderTasks();
}

function dragStart(e) {
    e.dataTransfer.setData('text/plain', e.target.dataset.index);
}

function dragOver(e) {
    e.preventDefault();
}

function drop(e) {
    e.preventDefault();
    const fromIndex = e.dataTransfer.getData('text/plain');
    const toIndex = e.currentTarget.dataset.index;

    const [movedTask] = tasks.splice(fromIndex, 1);
    tasks.splice(toIndex, 0, movedTask);

    saveTasks();
    renderTasks();
}

addTaskBtn.addEventListener('click', addTask);

filterButtons.forEach(btn =>
    btn.addEventListener('click', () => {
        document.querySelector('.filter-btn.active').classList.remove('active');
        btn.classList.add('active');
        renderTasks(btn.dataset.filter);
    })
);

renderTasks();

    </script>
</body>
</html>
